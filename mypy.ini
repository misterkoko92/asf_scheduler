[mypy]
python_version = 3.11
files = asf_app,scheduler,loaders,utils

exclude = ^(tests/|build/|dist/|venv/|\.venv/|\.tmp_asf/|new_repo/|~/)

follow_imports = skip
ignore_missing_imports = True
explicit_package_bases = True
namespace_packages = True

# Bootstrap non bloquant
check_untyped_defs = False
disallow_untyped_defs = False

disable_error_code = import-untyped,annotation-unchecked
warn_unused_ignores = True
warn_redundant_casts = True
show_error_codes = True
pretty = True

# Palier P2: vérification des fonctions non typées sur un sous-ensemble stable.
[mypy-asf_app.ui.ui_stats.stats_processor]
check_untyped_defs = True

[mypy-asf_app.ui.ui_communication.whatsapp_handler]
check_untyped_defs = True

[mypy-asf_app.ui.ui_logs]
check_untyped_defs = True

[mypy-asf_app.ui.ui_manual]
check_untyped_defs = True

[mypy-asf_app.config.email_defaults]
check_untyped_defs = True

[mypy-asf_app.ui.email_defaults]
check_untyped_defs = True

[mypy-asf_app.ui.ui_planning.state_planning]
check_untyped_defs = True
