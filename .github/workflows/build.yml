name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        shell: bash
        run: |
          pyinstaller run_app.py --onefile --name ASF-Scheduler --paths . \
            --copy-metadata streamlit --copy-metadata pandas --copy-metadata altair --copy-metadata click \
            --collect-all asf_app --collect-all scheduler

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASF-Scheduler-${{ matrix.os }}
          path: dist/**
