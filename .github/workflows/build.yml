name: Build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            SEP=";"
          else
            SEP=":"
          fi
          ADD_APP="app.py${SEP}."
          ADD_ASF="asf_app${SEP}asf_app"
          ADD_SCHED="scheduler${SEP}scheduler"
          ADD_LOADERS="loaders${SEP}loaders"
          pyinstaller run_app.py --onefile --name ASF-Scheduler --paths . \
            --add-data "$ADD_APP" --add-data "$ADD_ASF" --add-data "$ADD_SCHED" --add-data "$ADD_LOADERS" \
            --copy-metadata streamlit --copy-metadata pandas --copy-metadata altair --copy-metadata click \
            --collect-all streamlit --collect-submodules asf_app --collect-submodules scheduler --collect-submodules loaders --collect-submodules reportlab \
            --hidden-import asf_app --hidden-import scheduler --hidden-import loaders --hidden-import reportlab

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASF-Scheduler-${{ matrix.os }}
          path: dist/**

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release with binaries
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**/*
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
