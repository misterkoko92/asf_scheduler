<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>ASF Scheduler - Démarrage</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }

    .card {
      width: 430px;
      padding: 24px 28px 28px;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .logo {
      width: 220px;
      height: auto;
      object-fit: contain;
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      color: #003366;
      text-align: center;
    }

    .subtitle {
      font-size: 14px;
      color: #555;
      text-align: center;
    }

    .progress-container {
      width: 100%;
      margin-top: 10px;
      padding: 0 4px;
    }

    .bar-bg {
      width: 100%;
      height: 10px;
      border-radius: 6px;
      background: #e0e4ec;
      overflow: hidden;
    }

    .bar-fill {
      width: 40%;
      height: 100%;
      border-radius: 6px;
      background: linear-gradient(90deg, #0055aa, #00a8ff);
      animation: loading 1.4s ease-in-out infinite;
      transform-origin: 0 50%;
    }

    @keyframes loading {
      0% {
        transform: translateX(-60%) scaleX(0.4);
        opacity: 0.3;
      }
      40% {
        transform: translateX(0%) scaleX(0.9);
        opacity: 1;
      }
      100% {
        transform: translateX(120%) scaleX(0.4);
        opacity: 0.2;
      }
    }

    .footer {
      font-size: 11px;
      color: #888;
      margin-top: 6px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <img class="logo" src="splash.png" alt="ASF Logo" />
      <div class="title">ASF Scheduler</div>
      <div class="subtitle">Chargement du planning…</div>

      <div class="progress-container">
        <div class="bar-bg">
          <div class="bar-fill"></div>
        </div>
      </div>

      <div class="footer">Messagerie Médicale &amp; Fret Humanitaire</div>
    </div>
  </div>
</body>
</html>
