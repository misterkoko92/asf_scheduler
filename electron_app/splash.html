<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  body {
    margin: 0;
    background: rgba(255,255,255,0.0);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
  }

  .box {
    width: 450px;
    height: 300px;
    background: white;
    border-radius: 18px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 25px;
  }

  img {
    width: 220px;
    margin-bottom: 20px;
  }

  .txt {
    font-size: 17px;
    font-weight: 500;
    color: #003366;
    margin-bottom: 10px;
  }

  .progress-container {
    width: 80%;
    height: 12px;
    background: #ddd;
    border-radius: 8px;
    overflow: hidden;
  }

  .progress-bar {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #0055aa, #00aaff);
    transition: width 0.2s ease-out;
  }
</style>
</head>
<body>
  <div class="box">
    <img src="splash.png" />
    <div class="txt">Chargement du planning…</div>

    <div class="progress-container">
      <div class="progress-bar" id="bar"></div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require("electron");

    ipcRenderer.on("progress", (event, value) => {
      const bar = document.getElementById("bar");
      bar.style.width = value + "%";
    });
  </script>
</body>
</html>
